# 当有提交推送到您的默认分支时，此工作流将构建并推送一个 Docker 容器到 Azure Web 应用。
#
# 本工作流假定您已创建好目标 Azure App Service Web 应用。
有关说明，请参阅 https://docs.microsoft.com/en-us/azure/app-service/quickstart-custom-container?tabs=dotnet&pivots=container-linux
#
# 用于配置此工作流：
#
# 1. 下载适用于您的 Azure Web 应用的发布配置文件。您可以在 Azure 门户中通过该 Web 应用的“概述”页面下载此文件。
# 有关更多信息，请参阅：https://docs.microsoft.com/en-us/azure/app-service/deploy-github-actions?tabs=applevel#generate-deployment-credentials
#
# 2. 在您的仓库中创建一个名为 AZURE_WEBAPP_PUBLISH_PROFILE 的密钥，并将发布配置文件的内容粘贴为该密钥的值。
# 有关获取发布配置文件的说明，请参阅：https://docs.microsoft.com/azure/app-service/deploy-github-actions#configure-the-github-secret
#
# 3. 创建一个具有“repo”和“read:packages”权限的 GitHub 个人访问令牌。
#
# 4. 在你的 Azure Web 应用中创建三个应用设置：
#       DOCKER_REGISTRY_SERVER_URL：将其设置为 "https://ghcr.io"
#       DOCKER_REGISTRY_SERVER_USERNAME：请设置为拥有该仓库的 GitHub 用户名或组织名
#       DOCKER_REGISTRY_SERVER_PASSWORD：请设置为上一步中生成的 PAT 令牌值
#
# 5. 修改 AZURE_WEBAPP_NAME 的值。
#
# 关于 Azure 的 GitHub Actions 的更多信息：https://github.com/Azure/Actions
# 有关 Azure Web 应用部署操作的更多信息：https://github.com/Azure/webapps-deploy
# 有关使用 GitHub Actions 工作流部署到 Azure 的更多入门示例：https://github.com/Azure/actions-workflow-samples

名称: 将容器构建并部署到 Azure Web 应用程序

环境:
 :   # 请将其设置为您的 Azure Web 应用程序的名称

on:
  推送:
    : [ "main" ]
  workflow_dispatch:

permissions:
  内容: 阅读

jobs:
  构建:
    运行环境: ubuntu-latest

    步骤:
      - 用途: actions/checkout@v4

      - 名称: 设置 Docker Buildx
        使用: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - 名称: 登录 GitHub 容器注册表
        使用: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        使用:
          注册表: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push container image to registry
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          push: true
          tags: ghcr.io/${{ env.REPO }}:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'ghcr.io/${{ env.REPO }}:${{ github.sha }}'
